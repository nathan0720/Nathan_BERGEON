<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulletins - Accès Protégé</title>
    <style>
        /* Variables de couleurs inspirées du thème sombre de développeur */
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --border: #30363d;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            /* Animation d'apparition au chargement */
            animation: fadeIn 0.8s ease-out;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
            /* Animation douce du cadenas */
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            font-weight: 600;
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .btn-mail {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: transparent;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            padding: 12px 24px;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .btn-mail:hover {
            background-color: var(--border);
            border-color: var(--accent);
            color: #79c0ff;
        }

        /* Définition des animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔒</div>
        <h1>Accès Protégé</h1>
        <p>Par mesure de confidentialité, mes bulletins scolaires ne sont pas en libre accès sur ce portfolio.<br><br>Si vous souhaitez les consulter, n'hésitez pas à m'en faire la demande par e-mail, je vous les transmettrai avec plaisir !</p>
        
        <!-- Remplace l'adresse ci-dessous par la tienne -->
        <a href="mailto:nathan07.bergeon@gmail.com" class="btn-mail">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            ton.adresse@email.com
        </a>
    </div>
</body>
</html>
