<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur 403 - Accès Restreint</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #66fcf1;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .terminal-box {
            text-align: center;
            border: 2px solid #45a29e;
            padding: 40px;
            box-shadow: 0 0 20px #45a29e;
            background-color: rgba(0, 0, 0, 0.8);
            max-width: 600px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            color: #ff003c;
            animation: glitch 1.5s infinite;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .email-link {
            color: #c5c6c7;
            text-decoration: none;
            border-bottom: 1px dashed #66fcf1;
            font-weight: bold;
            font-size: 1.3em;
            transition: 0.3s;
        }
        .email-link:hover {
            background-color: #66fcf1;
            color: #0b0c10;
        }
        .cursor {
            display: inline-block;
            width: 12px;
            height: 1.2em;
            background-color: #66fcf1;
            vertical-align: middle;
            margin-left: 5px;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        @keyframes glitch {
            0% { text-shadow: 2px 0 0 rgba(0, 255, 255, 0.5), -2px 0 0 rgba(255, 0, 0, 0.5); }
            5% { text-shadow: -2px 0 0 rgba(0, 255, 255, 0.5), 2px 0 0 rgba(255, 0, 0, 0.5); }
            10% { text-shadow: 2px 0 0 rgba(0, 255, 255, 0.5), -2px 0 0 rgba(255, 0, 0, 0.5); }
            15% { text-shadow: none; }
            100% { text-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="terminal-box">
        <h1>> ERREUR_403</h1>
        <p>ACCÈS REFUSÉ : DONNÉES CONFIDENTIELLES</p>
        <p>Pour consulter mes bulletins scolaires, veuillez m'adresser une demande directement par e-mail :</p>
        <p>
            <a href="mailto:ton.adresse@email.com" class="email-link">ton.adresse@email.com</a><span class="cursor"></span>
        </p>
    </div>
</body>
</html>
